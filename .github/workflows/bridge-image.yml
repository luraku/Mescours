name: Image de la passerelle

# Construit l'image Docker de la passerelle NotebookLM (arm64 pour PocketDock, amd64 pour
# un PC/serveur) et la publie sur ghcr.io/luraku/mescours-bridge. Ainsi PocketDock n'a
# plus qu'à la télécharger au lieu de la construire dans sa VM émulée (très lent).
on:
  push:
    branches: ["**"]
    paths: ["bridge/**", ".github/workflows/bridge-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: bridge
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mescours-bridge:latest
            ghcr.io/${{ github.repository_owner }}/mescours-bridge:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Passerelle NotebookLM pour l'app Mes Cours
          cache-from: type=gha
          cache-to: type=gha,mode=max
