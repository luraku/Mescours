name: APK Android

on:
  push:
    branches: ["**"]
    paths: ["android/**", "nlm-core/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "nlm-core/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode = nombre de commits

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # nlm-core : client NotebookLM natif (Rust), compilé pour Android par Gradle.
      - name: Rust (cibles Android, cargo-ndk)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nlm-core

      - name: Tests nlm-core
        working-directory: nlm-core
        run: cargo test

      - name: Construire l'APK debug
        run: ./gradlew --no-daemon assembleDebug -PversionCode=$(git rev-list --count HEAD)

      # Signature release optionnelle : ajoutez les secrets KEYSTORE_BASE64,
      # KEYSTORE_PASSWORD, KEY_ALIAS et KEY_PASSWORD dans les réglages du dépôt.
      - name: Construire l'APK release signée
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          MESCOURS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MESCOURS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MESCOURS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mescours.jks"
          MESCOURS_KEYSTORE="$RUNNER_TEMP/mescours.jks" ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: mescours-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
