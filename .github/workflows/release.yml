name: Release

# Publie une release GitHub avec l'APK : lancer « Run workflow » avec la version (ex. 0.1.0),
# ou pousser un tag v0.1.0. Les notes viennent de la section correspondante de CHANGELOG.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex. 0.1.0)"
        required: true
      prerelease:
        description: "Marquer comme pré-version"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: |
          v="${VERSION#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          # Notes : section « ## v<version> » de CHANGELOG.md.
          awk -v h="## v$v" 'index($0,h)==1{p=1;next} /^## /{p=0} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "Version $v" > notes.md

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Rust (cibles Android, cargo-ndk)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nlm-core

      - name: Tests nlm-core
        working-directory: nlm-core
        run: cargo test

      - name: Clé de signature privée (optionnelle)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mescours.jks"
          echo "MESCOURS_KEYSTORE=$RUNNER_TEMP/mescours.jks" >> "$GITHUB_ENV"

      - name: Construire l'APK release
        working-directory: android
        env:
          MESCOURS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MESCOURS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MESCOURS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/MesCours-v$VERSION.apk"

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          gh release create "v$VERSION" "MesCours-v$VERSION.apk" \
            --target "$GITHUB_SHA" --title "Mes Cours v$VERSION" --notes-file notes.md $flags
