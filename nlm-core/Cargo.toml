[package]
name = "nlm-core"
version = "0.1.0"
edition = "2021"
description = "Client NotebookLM (sous-ensemble de notebooklm-py porté en Rust) pour l'app Mes Cours"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "nlm_core"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = { version = "0.28.3", features = ["tokio"] }
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls-webpki-roots", "json", "stream", "gzip", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
thiserror = "2.0"
url = "2.5"
html-escape = "0.2.13"
rand = "0.8"
log = "0.4"
once_cell = "1.20"
futures-util = "0.3"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
